<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shot List</title>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h1>Shot List</h1>
          <button id="new-project" class="btn primary">+ New project</button>
        </div>
        <nav id="project-list"></nav>
        <div class="sidebar-foot">
          <button id="export" class="btn">Export backup</button>
          <label class="btn">
            Import backup
            <input id="import" type="file" accept="application/json" hidden />
          </label>
        </div>
      </aside>

      <main id="main"></main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
